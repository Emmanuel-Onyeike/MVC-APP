<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVC_SYSTEM_INTERFACE</title>
    <style>
        :root { --blue: #00d4ff; --dark: #0b0e14; --card: #161b22; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .header { border-bottom: 2px solid var(--blue); padding-bottom: 10px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: var(--card); padding: 15px; border-left: 4px solid var(--blue); }
        
        /* THE MODAL - CENTERED */
        #modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--card); border: 2px solid var(--blue);
            padding: 40px; z-index: 100; display: none; text-align: center;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; }
        button { background: var(--blue); border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>PROJECT_MVC // <span style="color:var(--blue)">ENGINEERING_LOG</span></h1>
    </div>

    <div id="task-container" class="grid">
        </div>

    <button onclick="showModal()" style="margin-top: 40px;">INITIALIZE NEW TASK</button>

    <div id="overlay" class="overlay"></div>
    <div id="modal">
        <h2 style="color:var(--blue)">SYSTEM_ALERT</h2>
        <p>New Task entry initiated. Confirm deployment?</p>
        <button onclick="closeModal()">CONFIRM</button>
    </div>

    <script>
        // Fetching from our "Controller" (The API)
        async function loadData() {
            const res = await fetch('/api/tasks');
            const data = await res.json();
            document.getElementById('task-container').innerHTML = data.map(t => `
                <div class="card">
                    <h3>${t.title}</h3>
                    <small>STATUS: ${t.status}</small>
                </div>
            `).join('');
        }

        function showModal() { 
            document.getElementById('modal').style.display = 'block'; 
            document.getElementById('overlay').style.display = 'block'; 
        }
        function closeModal() { 
            document.getElementById('modal').style.display = 'none'; 
            document.getElementById('overlay').style.display = 'none'; 
        }

        loadData();
    </script>
</body>
</html>
