<!DOCTYPE html>
<html>
<head>
    <title>MVC App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #111827;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            outline: none;
            background: #1f2937;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #16a34a;
        }

        .users {
            margin-top: 20px;
        }

        .user {
            background: #1f2937;
            padding: 10px;
            border-radius: 8px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🚀 MVC App</h1>

    <form id="userForm">
        <input type="text" id="name" placeholder="Enter name" required>
        <button type="submit">Add User</button>
    </form>

    <div class="users" id="userList"></div>
</div>

<script>
    const form = document.getElementById('userForm');
    const userList = document.getElementById('userList');

    form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('name').value;

    await fetch('/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
    });

    document.getElementById('name').value = "";
    loadUsers();
});

async function loadUsers() {
    const res = await fetch('/api');
    const users = await res.json();

    userList.innerHTML = "";
    users.forEach(user => {
        userList.innerHTML += `<div class="user">${user.name}</div>`;
    });
}
    loadUsers();
</script>

</body>
</html>
